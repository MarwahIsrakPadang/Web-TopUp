[global]
error_log = /proc/self/fd/2
log_level = notice

[www]
user = www-data
group = www-data

listen = 9000

pm = dynamic
pm.max_children = 20
pm.start_servers = 5
pm.min_spare_servers = 3
pm.max_spare_servers = 8
pm.max_requests = 500

pm.status_path = /status
ping.path = /ping
ping.response = pong

request_terminate_timeout = 120s
request_slowlog_timeout = 10s
slowlog = /var/log/php-slow.log